name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Generate Missing Version Catalog
      run: |
        mkdir -p gradle
        echo '[versions]' > gradle/libs.versions.toml
        echo 'agp = "8.3.0"' >> gradle/libs.versions.toml
        echo 'kotlin = "1.9.22"' >> gradle/libs.versions.toml
        echo 'coreKtx = "1.12.0"' >> gradle/libs.versions.toml
        echo 'lifecycleRuntimeKtx = "2.7.0"' >> gradle/libs.versions.toml
        echo 'activityCompose = "1.8.2"' >> gradle/libs.versions.toml
        echo 'composeBom = "2024.02.01"' >> gradle/libs.versions.toml
        echo 'ksp = "1.9.22-1.0.17"' >> gradle/libs.versions.toml
        echo 'secrets = "2.0.1"' >> gradle/libs.versions.toml
        echo 'googleServices = "4.4.1"' >> gradle/libs.versions.toml
        echo '' >> gradle/libs.versions.toml
        echo '[libraries]' >> gradle/libs.versions.toml
        echo 'androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }' >> gradle/libs.versions.toml
        echo 'androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }' >> gradle/libs.versions.toml
        echo 'androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }' >> gradle/libs.versions.toml
        echo 'androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }' >> gradle/libs.versions.toml
        echo 'androidx-ui = { group = "androidx.compose.ui", name = "ui" }' >> gradle/libs.versions.toml
        echo 'androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }' >> gradle/libs.versions.toml
        echo 'androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }' >> gradle/libs.versions.toml
        echo 'androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }' >> gradle/libs.versions.toml
        echo 'androidx-material3 = { group = "androidx.compose.material3", name = "material3" }' >> gradle/libs.versions.toml
        echo '' >> gradle/libs.versions.toml
        echo '[plugins]' >> gradle/libs.versions.toml
        echo 'android-application = { id = "com.android.application", version.ref = "agp" }' >> gradle/libs.versions.toml
        echo 'kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }' >> gradle/libs.versions.toml
        echo 'kotlin-compose = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }' >> gradle/libs.versions.toml
        echo 'google-devtools-ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }' >> gradle/libs.versions.toml
        echo 'secrets = { id = "com.google.android.libraries.mapsplatform.secrets-gradle-plugin", version.ref = "secrets" }' >> gradle/libs.versions.toml
        echo 'google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }' >> gradle/libs.versions.toml

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Generate Keystore & Correct Google Services Config
      run: |
        mkdir -p app
        keytool -genkey -v -keystore app/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" || true
        keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" || true

        DUMMY_JSON='{
          "project_info": { "project_number": "123456789012", "project_id": "sample-project", "storage_bucket": "sample-project.appspot.com" },
          "client": [{
            "client_info": { "mobilesdk_app_id": "1:123456789012:android:1234567890123456789012", "android_client_info": { "package_name": "com.aistudio.myanmarts.krvfwp" } },
            "oauth_client": [], "api_key": [{ "current_key": "AIzaSyDummyKeyForBuildOnly" }],
            "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
          }],
          "configuration_version": "1"
        }'
        echo "$DUMMY_JSON" > app/google-services.json || true
        echo "$DUMMY_JSON" > google-services.json || true

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew || true

    - name: Build with Gradle
      run: ./gradlew assembleDebug --stacktrace || gradle assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: app-debug
        path: |
          **/build/outputs/apk/debug/*.apk
          **/build/outputs/apk/**/*.apk
